name: Publish verified frozen Label_Match prerelease

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

concurrency:
  group: prepublish-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-before-publish:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      ZIP_NAME: Label_Match-${{ github.ref_name }}.zip
      CHECKSUM_NAME: Label_Match-${{ github.ref_name }}.zip.sha256

    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up verification Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Bind exact annotated tag to origin main
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch authoritative origin/main." }
          $commit = (git rev-parse --verify "HEAD^{commit}").Trim().ToLowerInvariant()
          $main = (git rev-parse --verify "refs/remotes/origin/main^{commit}").Trim().ToLowerInvariant()
          $tagRef = "refs/tags/$env:RELEASE_TAG"
          $tagType = (git cat-file -t $tagRef).Trim()
          $tagObject = (git rev-parse --verify $tagRef).Trim().ToLowerInvariant()
          $tagCommit = (git rev-parse --verify "$tagRef^{commit}").Trim().ToLowerInvariant()
          $sourceEpoch = (git show -s --format=%ct HEAD).Trim()
          if ($env:GITHUB_REF_TYPE -cne "tag" -or $tagType -cne "tag" -or
              $commit -cne $main -or $tagCommit -cne $commit -or
              $sourceEpoch -cnotmatch '^[1-9][0-9]*$') {
            throw "Release tag must be one annotated tag at the exact origin/main head."
          }
          $tagReport = Join-Path $env:RUNNER_TEMP "label-prepublish-tag-identity.json"
          python -I -S tools\verify_release_tag_attestation.py `
            --expected-tag $env:RELEASE_TAG `
            --expected-commit $commit `
            --report $tagReport
          if ($LASTEXITCODE -ne 0) { throw "Canonical release tag parser failed." }
          $identity = Get-Content -Raw -Encoding UTF8 -LiteralPath $tagReport | ConvertFrom-Json
          if ($identity.tag_object -cne $tagObject -or
              $identity.peeled_commit -cne $commit -or
              $identity.message -cne "Release $env:RELEASE_TAG") {
            throw "Canonical release tag identity differs from the prebound Git identity."
          }
          "RELEASE_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TREE=$((git rev-parse --verify 'HEAD^{tree}').Trim().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG_OBJECT=$tagObject" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_SOURCE_EPOCH=$sourceEpoch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Acquire exact externally staged draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $workRoot = Join-Path $env:RUNNER_TEMP "label-prepublish-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & tools\prepublish_release_gate.ps1 `
            -Mode AcquireDraft `
            -Tag $env:RELEASE_TAG `
            -ExpectedCommit $env:RELEASE_COMMIT `
            -ZipName $env:ZIP_NAME `
            -ChecksumName $env:CHECKSUM_NAME `
            -RecordMember "Label_Match/bootstrap-integrity.json" `
            -WorkRoot $workRoot `
            -StatePath (Join-Path $workRoot "prepublish-state.json")

      - name: Run Label_Match own frozen verifier before publish
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $reportPath = Join-Path $env:RUNNER_TEMP "label-prepublish-verification.json"
          python -I -S tools\verify_frozen_release_assets.py `
            --archive $env:PREPUBLISH_ZIP_PATH `
            --checksum $env:PREPUBLISH_CHECKSUM_PATH `
            --expected-tag $env:RELEASE_TAG `
            --expected-commit $env:RELEASE_COMMIT `
            --expected-tree $env:RELEASE_TREE `
            --expected-tag-object $env:RELEASE_TAG_OBJECT `
            --expected-source-epoch $env:RELEASE_SOURCE_EPOCH `
            --expected-archive-sha256 $env:PREPUBLISH_ZIP_SHA256 `
            --expected-archive-size $env:PREPUBLISH_ZIP_SIZE `
            --expected-main-exe-sha256 $env:PREPUBLISH_MAIN_EXE_SHA256 `
            --report $reportPath
          if ($LASTEXITCODE -ne 0) { throw "Label_Match prepublish verifier failed." }
          "PREPUBLISH_VERIFIER_REPORT=$reportPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish only the unchanged verifier-approved draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          & tools\prepublish_release_gate.ps1 `
            -Mode PublishDraft `
            -Tag $env:RELEASE_TAG `
            -ExpectedCommit $env:RELEASE_COMMIT `
            -ZipName $env:ZIP_NAME `
            -ChecksumName $env:CHECKSUM_NAME `
            -RecordMember "Label_Match/bootstrap-integrity.json" `
            -WorkRoot (Split-Path -Parent $env:PREPUBLISH_ZIP_PATH) `
            -StatePath $env:PREPUBLISH_STATE_PATH `
            -VerifierReportPath $env:PREPUBLISH_VERIFIER_REPORT
