name: Full CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: full-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-ci:
    name: full-ci (Python 3.12.10)
    runs-on: windows-latest
    env:
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify hosted UI evidence scope
        id: ui_scope
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          $required = $true
          $before = "$env:BEFORE_SHA".Trim().ToLowerInvariant()
          if ($before -match '^[0-9a-f]{40}$' -and $before -notmatch '^0+$') {
            git cat-file -e "$before^{commit}" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $required = $false
              foreach ($path in @(git diff --name-only $before $env:GITHUB_SHA)) {
                if ($path -match '^(Label_Match\.py$|tools/capture_label_operator_ui\.py$|config/app_settings\.json$|assets/|tests/test_label_operator_workbench\.py$)') {
                  $required = $true
                  break
                }
              }
            }
          }
          "required=$($required.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "hosted_ui_pack_required=$($required.ToString().ToLowerInvariant())"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install hash-locked CI dependencies
        run: |
          python -I -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --no-deps -r requirements-release.txt
          python -I -m pip check

      - name: Run non-physical regression exactly once
        run: python -m pytest -q --deselect tests/test_label_operator_workbench.py::test_live_submission_retry_hides_raw_server_error_and_keeps_five_scan_rows --deselect tests/test_label_operator_workbench.py::test_display2_1366_scale100_keeps_operator_content_inside_its_regions

      - name: Run hosted UI retry geometry when UI changed
        if: steps.ui_scope.outputs.required == 'true'
        run: python -m pytest -q tests/test_label_operator_workbench.py::test_live_submission_retry_hides_raw_server_error_and_keeps_five_scan_rows
