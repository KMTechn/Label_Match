name: Full CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: full-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-ci:
    name: full-ci (Python 3.12.10)
    runs-on: windows-latest
    env:
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Classify hosted UI evidence scope
        id: ui_scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baseline = ""
          try {
            $response = gh api --method GET `
              "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" `
              -f branch=main -f event=push -f status=success -f per_page=100
            if ($LASTEXITCODE -ne 0) { throw "Full CI baseline query failed." }
            foreach ($run in @(($response | ConvertFrom-Json).workflow_runs)) {
              $candidate = ([string]$run.head_sha).Trim().ToLowerInvariant()
              if ($candidate -notmatch '^[0-9a-f]{40}$' -or
                  $candidate -ceq "$env:GITHUB_SHA".ToLowerInvariant()) { continue }
              git merge-base --is-ancestor $candidate $env:GITHUB_SHA 2>$null
              if ($LASTEXITCODE -eq 0) {
                $baseline = $candidate
                break
              }
            }
          } catch {
            Write-Warning "No trusted successful Full CI baseline: $($_.Exception.Message)"
            $baseline = ""
          }
          $required = @(
            python -I -S tools/classify_hosted_ui_scope.py `
              --baseline "$baseline" `
              --head "$env:GITHUB_SHA"
          )
          if ($LASTEXITCODE -ne 0 -or $required.Count -ne 1 -or
              @("true", "false") -cnotcontains $required[0]) {
            throw "Hosted UI scope classifier failed closed."
          }
          "required=$($required[0])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "trusted_full_ci_baseline=$($baseline -replace '^$', '<none>')"
          Write-Output "hosted_ui_pack_required=$($required[0])"

      - name: Install hash-locked CI dependencies
        run: |
          python -I -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --no-deps -r requirements-release.txt
          python -I -m pip check

      - name: Run non-physical regression exactly once
        run: python -m pytest -q --deselect tests/test_label_operator_workbench.py::test_live_submission_retry_hides_raw_server_error_and_keeps_five_scan_rows --deselect tests/test_label_operator_workbench.py::test_display2_1366_scale100_keeps_operator_content_inside_its_regions

      - name: Run hosted UI retry geometry when UI changed
        if: steps.ui_scope.outputs.required == 'true'
        run: python -m pytest -q tests/test_label_operator_workbench.py::test_live_submission_retry_hides_raw_server_error_and_keeps_five_scan_rows
