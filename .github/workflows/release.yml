name: Verify Frozen GitHub Release for Label_Match

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

jobs:
  verify-frozen-release:
    runs-on: windows-latest
    env:
      LABEL_MATCH_RELEASE_TAG: ${{ github.ref_name }}
      PYTHONNOUSERSITE: "1"

    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up verification Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Validate annotated tag and exact source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -I -S tools/verify_release_identity.py `
            --expected-tag "$env:LABEL_MATCH_RELEASE_TAG" `
            --expected-sha "$env:GITHUB_SHA" `
            --reviewed-ref "refs/remotes/origin/main" `
            --report "$env:RUNNER_TEMP\label-match-release-identity.json"
          if ($LASTEXITCODE -ne 0) { throw "Release source identity verification failed." }

      - name: Read canonical final annotated tag identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseCommit = (git rev-parse --verify "HEAD^{commit}").Trim().ToLowerInvariant()
          $localTagObject = (git rev-parse --verify "refs/tags/$env:LABEL_MATCH_RELEASE_TAG").Trim().ToLowerInvariant()
          $localTagType = (git cat-file -t "refs/tags/$env:LABEL_MATCH_RELEASE_TAG").Trim()
          $localTagCommit = (git rev-parse --verify "refs/tags/$env:LABEL_MATCH_RELEASE_TAG^{commit}").Trim().ToLowerInvariant()
          $reviewedMain = (git rev-parse --verify "refs/remotes/origin/main^{commit}").Trim().ToLowerInvariant()
          if (
            $localTagObject -cnotmatch '^[0-9a-f]{40}$' -or
            $localTagType -cne "tag" -or
            $localTagCommit -cne $releaseCommit -or
            $reviewedMain -cne $releaseCommit
          ) {
            throw "BLOCKED: built-in Git tag, peeled commit, HEAD, and reviewed main identity differ."
          }
          python -I -S tools/verify_release_tag_attestation.py `
            --expected-tag "$env:LABEL_MATCH_RELEASE_TAG" `
            --expected-commit "$releaseCommit" `
            --report "$env:RUNNER_TEMP\label-match-canonical-tag-identity.json"
          if ($LASTEXITCODE -ne 0) { throw "Canonical final tag verification failed." }
          $tagIdentity = Get-Content -Raw -Encoding UTF8 `
            -LiteralPath "$env:RUNNER_TEMP\label-match-canonical-tag-identity.json" |
            ConvertFrom-Json
          if (
            $tagIdentity.schema_version -cne "label-match-canonical-annotated-tag-v1" -or
            $tagIdentity.tag_object -cne $localTagObject -or
            $tagIdentity.tag_object_type -cne "tag" -or
            $tagIdentity.peeled_commit -cne $releaseCommit -or
            $tagIdentity.message -cne "Release $env:LABEL_MATCH_RELEASE_TAG"
          ) {
            throw "BLOCKED: canonical tag parser output differs from prebound Git identity."
          }

      - name: Record exact-SHA Hosted CI status without making it a release gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseCommit = (git rev-parse --verify "HEAD^{commit}").Trim().ToLowerInvariant()
          $response = gh api --method GET "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" `
            -f branch=main -f event=push -f head_sha="$releaseCommit" -f per_page=100 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Output "hosted_ci=WAIVED_NOT_TESTED reason=query_unavailable sha=$releaseCommit"
            exit 0
          }
          $runs = (ConvertFrom-Json -InputObject $response).workflow_runs
          $matches = @($runs | Where-Object {
            $_.head_sha -ceq $releaseCommit -and $_.head_branch -ceq "main" -and
            $_.event -ceq "push"
          })
          $successful = @($matches | Where-Object {
            $_.status -ceq "completed" -and $_.conclusion -ceq "success"
          })
          if ($successful.Count -gt 0) {
            $run = $successful | Sort-Object id -Descending | Select-Object -First 1
            Write-Output "hosted_ci=PASS_NON_GATING sha=$releaseCommit run_id=$($run.id) attempt=$($run.run_attempt)"
            exit 0
          }
          $states = @($matches | ForEach-Object {
            "id=$($_.id):status=$($_.status):conclusion=$($_.conclusion):attempt=$($_.run_attempt)"
          }) -join ","
          Write-Output "hosted_ci=WAIVED_NOT_TESTED sha=$releaseCommit observed=$states"

      - name: Wait boundedly for externally published frozen prerelease
        id: frozen_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $assetRoot = Join-Path $env:RUNNER_TEMP "label-match-frozen-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $assetRoot) {
            throw "Fresh frozen-asset path already exists: $assetRoot"
          }
          New-Item -ItemType Directory -Path $assetRoot | Out-Null
          $zipName = "Label_Match-$env:LABEL_MATCH_RELEASE_TAG.zip"
          $checksumName = "$zipName.sha256"
          $release = $null
          $attemptLimit = 180
          for ($attempt = 1; $attempt -le $attemptLimit; $attempt++) {
            $raw = gh api `
              -H "X-GitHub-Api-Version: 2026-03-10" `
              "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:LABEL_MATCH_RELEASE_TAG" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $candidateRelease = ConvertFrom-Json -InputObject $raw
              $candidateAssets = @($candidateRelease.assets)
              $candidateNames = @($candidateAssets | ForEach-Object { $_.name } | Sort-Object)
              $expectedNames = @($checksumName, $zipName) | Sort-Object
              $assetsReady = (
                $candidateNames.Count -eq 2 -and
                ($candidateNames -join "`n") -ceq ($expectedNames -join "`n") -and
                @($candidateAssets | Where-Object {
                  $_.state -cne "uploaded" -or $_.size -le 0 -or
                  $_.digest -cnotmatch '^sha256:[0-9a-f]{64}$'
                }).Count -eq 0
              )
              if (
                $candidateRelease.tag_name -ceq $env:LABEL_MATCH_RELEASE_TAG -and
                $candidateRelease.draft -eq $false -and
                $candidateRelease.prerelease -eq $true -and
                $candidateRelease.immutable -eq $true -and
                $assetsReady
              ) {
                $release = $candidateRelease
                break
              }
            }
            if ($attempt -lt $attemptLimit) {
              Start-Sleep -Seconds 10
            }
          }
          if ($null -eq $release) {
            throw "BLOCKED: immutable frozen prerelease was not finalized within 1800 seconds. tag=$env:LABEL_MATCH_RELEASE_TAG"
          }
          if (
            $release.tag_name -cne $env:LABEL_MATCH_RELEASE_TAG -or
            $release.draft -ne $false -or
            $release.prerelease -ne $true -or
            $release.immutable -ne $true
          ) {
            throw "BLOCKED: external release must be an immutable published prerelease for the exact tag."
          }
          $releaseCommit = (git rev-parse --verify "HEAD^{commit}").Trim().ToLowerInvariant()
          $releaseTree = (git rev-parse --verify "HEAD^{tree}").Trim().ToLowerInvariant()
          $remoteMain = @(git ls-remote origin "refs/heads/main")
          if ($remoteMain.Count -ne 1) {
            throw "BLOCKED: remote main cardinality is not exactly one before download."
          }
          $remoteMainCommit = ($remoteMain[0] -split "`t")[0].ToLowerInvariant()
          if ($remoteMainCommit -cne $releaseCommit) {
            throw "BLOCKED: remote main changed before frozen asset download."
          }
          if (
            $release.target_commitish -cne "main" -and
            $release.target_commitish -cne $releaseCommit
          ) {
            throw "BLOCKED: release target must be exact main or the exact tagged commit. target=$($release.target_commitish)"
          }
          $expectedReleaseName = "Release $env:LABEL_MATCH_RELEASE_TAG"
          $normalizedReleaseBody = ([string]$release.body).Replace("`r`n", "`n")
          if ($normalizedReleaseBody.Contains("`r") -or $normalizedReleaseBody.EndsWith("`n`n")) {
            throw "BLOCKED: release body allows only LF and at most one trailing LF."
          }
          $actualReleaseBody = $normalizedReleaseBody.TrimEnd([char[]]"`n")
          $bodyLines = @($actualReleaseBody -split "`n")
          if (
            $release.name -cne $expectedReleaseName -or
            $bodyLines.Count -ne 10 -or
            $bodyLines[0] -cne "Internal prerelease; not production-ready." -or
            $bodyLines[1] -cne "Tag: $env:LABEL_MATCH_RELEASE_TAG" -or
            $bodyLines[2] -cne "Commit: $releaseCommit" -or
            $bodyLines[3] -cne "Tree: $releaseTree" -or
            $bodyLines[4] -cne "Artifact: $zipName" -or
            $bodyLines[8] -cne "Factory-Contract-SHA256: adaa08684ebb291837327f63f967a4f22650dff72c4c1dc56ce1a9bee6b5404a" -or
            $bodyLines[9] -cne "Status: QUARANTINED_PENDING_FACTORY_QUALIFICATION"
          ) {
            throw "BLOCKED: release title or exact identity notes are not canonical."
          }
          if ($bodyLines[5] -cnotmatch '^Artifact-SHA256: ([0-9a-f]{64})$') {
            throw "BLOCKED: release body archive SHA-256 is not canonical."
          }
          $artifactSha256 = $Matches[1]
          if ($bodyLines[6] -cnotmatch '^Artifact-Size: ([1-9][0-9]*)$') {
            throw "BLOCKED: release body archive size is not canonical."
          }
          [Int64]$artifactSize = 0
          if (-not [Int64]::TryParse(
            $Matches[1],
            [Globalization.NumberStyles]::None,
            [Globalization.CultureInfo]::InvariantCulture,
            [ref]$artifactSize
          )) {
            throw "BLOCKED: release body archive size is outside Int64."
          }
          if ($bodyLines[7] -cnotmatch '^Main-EXE-SHA256: ([0-9a-f]{64})$') {
            throw "BLOCKED: release body main executable SHA-256 is not canonical."
          }
          $mainExeSha256 = $Matches[1]
          $expectedAssets = @($checksumName, $zipName) | Sort-Object
          $assets = @($release.assets)
          $actualAssets = @($assets | ForEach-Object { $_.name } | Sort-Object)
          if ($actualAssets.Count -ne 2 -or ($actualAssets -join "`n") -cne ($expectedAssets -join "`n")) {
            throw "BLOCKED: release must contain exactly the frozen ZIP and checksum. actual=$($actualAssets -join ',')"
          }
          foreach ($asset in $assets) {
            if ($asset.state -cne "uploaded" -or $asset.size -le 0 -or $asset.digest -cnotmatch '^sha256:[0-9a-f]{64}$') {
              throw "BLOCKED: release asset is not completely uploaded: $($asset.name)"
            }
          }
          $zipAsset = @($assets | Where-Object name -CEQ $zipName)
          if (
            $zipAsset.Count -ne 1 -or
            $zipAsset[0].size -ne $artifactSize -or
            $zipAsset[0].digest -cne "sha256:$artifactSha256"
          ) {
            throw "BLOCKED: published ZIP metadata differs from the immutable release body."
          }
          $snapshot = [ordered]@{
            release_id = $release.id
            tag_name = $release.tag_name
            name = $release.name
            body = $actualReleaseBody
            target_commitish = $release.target_commitish
            draft = $release.draft
            prerelease = $release.prerelease
            immutable = $release.immutable
            assets = @($assets | Sort-Object name | ForEach-Object {
              [ordered]@{
                id = $_.id
                name = $_.name
                size = $_.size
                digest = $_.digest
                state = $_.state
              }
            })
          }
          $snapshot | ConvertTo-Json -Depth 6 -Compress | Set-Content `
            -Encoding utf8NoBOM `
            -LiteralPath "$env:RUNNER_TEMP\label-match-frozen-release-metadata.json"
          gh release download "$env:LABEL_MATCH_RELEASE_TAG" `
            --repo "$env:GITHUB_REPOSITORY" `
            --pattern "$zipName" `
            --pattern "$checksumName" `
            --dir "$assetRoot"
          if ($LASTEXITCODE -ne 0) { throw "Frozen release asset download failed." }
          $downloaded = @(Get-ChildItem -LiteralPath $assetRoot -File)
          if ($downloaded.Count -ne 2) {
            throw "BLOCKED: frozen asset directory must contain exactly two files."
          }
          "asset_root=$assetRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum_name=$checksumName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_sha256=$artifactSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_size=$artifactSize" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "main_exe_sha256=$mainExeSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "frozen_prerelease=FOUND release_id=$($release.id) assets=2"

      - name: Independently verify frozen release bytes
        shell: pwsh
        env:
          FROZEN_ASSET_ROOT: ${{ steps.frozen_release.outputs.asset_root }}
          FROZEN_ZIP_NAME: ${{ steps.frozen_release.outputs.zip_name }}
          FROZEN_CHECKSUM_NAME: ${{ steps.frozen_release.outputs.checksum_name }}
          EXPECTED_ARCHIVE_SHA256: ${{ steps.frozen_release.outputs.artifact_sha256 }}
          EXPECTED_ARCHIVE_SIZE: ${{ steps.frozen_release.outputs.artifact_size }}
          EXPECTED_MAIN_EXE_SHA256: ${{ steps.frozen_release.outputs.main_exe_sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $releaseCommit = (git rev-parse --verify "HEAD^{commit}").Trim().ToLowerInvariant()
          $releaseTree = (git rev-parse --verify "HEAD^{tree}").Trim().ToLowerInvariant()
          $sourceEpoch = (git show -s --format=%ct HEAD).Trim()
          if ($sourceEpoch -cnotmatch '^[1-9][0-9]*$') {
            throw "Tagged commit source epoch is invalid."
          }
          $tagIdentity = Get-Content -Raw -Encoding UTF8 `
            -LiteralPath "$env:RUNNER_TEMP\label-match-canonical-tag-identity.json" |
            ConvertFrom-Json
          python -I -S tools/verify_frozen_release_assets.py `
            --archive (Join-Path $env:FROZEN_ASSET_ROOT $env:FROZEN_ZIP_NAME) `
            --checksum (Join-Path $env:FROZEN_ASSET_ROOT $env:FROZEN_CHECKSUM_NAME) `
            --expected-tag "$env:LABEL_MATCH_RELEASE_TAG" `
            --expected-commit "$releaseCommit" `
            --expected-tree "$releaseTree" `
            --expected-tag-object "$($tagIdentity.tag_object)" `
            --expected-source-epoch "$sourceEpoch" `
            --expected-archive-sha256 "$env:EXPECTED_ARCHIVE_SHA256" `
            --expected-archive-size "$env:EXPECTED_ARCHIVE_SIZE" `
            --expected-main-exe-sha256 "$env:EXPECTED_MAIN_EXE_SHA256" `
            --report "$env:RUNNER_TEMP\label-match-frozen-release-verification.json"
          if ($LASTEXITCODE -ne 0) { throw "Frozen release verification failed." }
          $verification = Get-Content -Raw -Encoding UTF8 `
            -LiteralPath "$env:RUNNER_TEMP\label-match-frozen-release-verification.json" |
            ConvertFrom-Json
          if ($verification.qualification_receipt_status -cne "NOT_TESTED_EXTERNAL_REQUIRED") {
            throw "Public workflow must not claim access to the preserved local Phase-B receipt."
          }
          Write-Output "external_phase1_receipt_parity=REQUIRED_NOT_TESTED"

      - name: Recheck immutable remote metadata after byte verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $releaseCommit = (git rev-parse --verify "HEAD^{commit}").Trim().ToLowerInvariant()
          $releaseTree = (git rev-parse --verify "HEAD^{tree}").Trim().ToLowerInvariant()
          $tagIdentity = Get-Content -Raw -Encoding UTF8 `
            -LiteralPath "$env:RUNNER_TEMP\label-match-canonical-tag-identity.json" |
            ConvertFrom-Json
          $initial = Get-Content -Raw -Encoding UTF8 `
            -LiteralPath "$env:RUNNER_TEMP\label-match-frozen-release-metadata.json"
          $release = gh api `
            -H "X-GitHub-Api-Version: 2026-03-10" `
            "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:LABEL_MATCH_RELEASE_TAG" |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Final release metadata query failed." }
          $currentReleaseBody = ([string]$release.body).Replace("`r`n", "`n").TrimEnd([char[]]"`n")
          $current = [ordered]@{
            release_id = $release.id
            tag_name = $release.tag_name
            name = $release.name
            body = $currentReleaseBody
            target_commitish = $release.target_commitish
            draft = $release.draft
            prerelease = $release.prerelease
            immutable = $release.immutable
            assets = @($release.assets | Sort-Object name | ForEach-Object {
              [ordered]@{
                id = $_.id
                name = $_.name
                size = $_.size
                digest = $_.digest
                state = $_.state
              }
            })
          } | ConvertTo-Json -Depth 6 -Compress
          if ($release.immutable -ne $true -or $current -cne $initial.Trim()) {
            throw "BLOCKED: release or asset IDs/sizes/digests changed during verification."
          }
          $remoteTag = @(git ls-remote origin "refs/tags/$env:LABEL_MATCH_RELEASE_TAG")
          $remotePeel = @(git ls-remote origin "refs/tags/$env:LABEL_MATCH_RELEASE_TAG^{}")
          $remoteMain = @(git ls-remote origin "refs/heads/main")
          if ($remoteTag.Count -ne 1 -or $remotePeel.Count -ne 1 -or $remoteMain.Count -ne 1) {
            throw "BLOCKED: final remote tag/peel/main cardinality is not exactly one."
          }
          $tagObject = ($remoteTag[0] -split "`t")[0].ToLowerInvariant()
          $peeledCommit = ($remotePeel[0] -split "`t")[0].ToLowerInvariant()
          $mainCommit = ($remoteMain[0] -split "`t")[0].ToLowerInvariant()
          if (
            $tagObject -cne $tagIdentity.tag_object -or
            $peeledCommit -cne $releaseCommit -or
            $mainCommit -cne $releaseCommit
          ) {
            throw "BLOCKED: final remote tag object, peeled commit, or main commit changed."
          }
          if ((git rev-parse "HEAD^{tree}").Trim().ToLowerInvariant() -cne $releaseTree) {
            throw "BLOCKED: checkout tree changed during verification."
          }
          Write-Output "final_remote_recheck=PASS release_id=$($release.id) assets=2 tag_object=$tagObject commit=$releaseCommit"

      - name: Clean downloaded verification inputs
        if: ${{ always() }}
        shell: pwsh
        env:
          FROZEN_ASSET_ROOT: ${{ steps.frozen_release.outputs.asset_root }}
        run: |
          $candidate = $env:FROZEN_ASSET_ROOT
          if ([string]::IsNullOrWhiteSpace($candidate)) {
            $candidate = Join-Path $env:RUNNER_TEMP "label-match-frozen-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          }
          if (Test-Path -LiteralPath $candidate) {
            $resolved = [IO.Path]::GetFullPath($candidate)
            $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
            if (-not $resolved.StartsWith($runnerTemp, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Refusing to clean frozen assets outside RUNNER_TEMP: $resolved"
            }
            Remove-Item -LiteralPath $resolved -Recurse -Force
          }
